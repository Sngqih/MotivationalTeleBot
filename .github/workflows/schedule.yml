name: Morning Happiness Bot

on:
  schedule:
    # This runs at 23:00 UTC, which is 7:00 AM SGT (Singapore Time)
    - cron: '17 0 * * *'
  workflow_dispatch: # This adds a manual 'Run' button so you can test it immediately

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run the script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python happiness.py
